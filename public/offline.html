<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumen — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      background: oklch(0.14 0.015 275);
      color: oklch(0.97 0.01 280);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .container {
      max-width: 360px;
      text-align: center;
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      border-radius: 16px;
      background: linear-gradient(135deg, oklch(0.72 0.19 25), oklch(0.68 0.22 340));
      display: grid;
      place-items: center;
    }
    .icon svg {
      width: 32px;
      height: 32px;
      color: white;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      color: oklch(0.68 0.02 280);
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .retry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 32px;
      border-radius: 999px;
      background: oklch(0.72 0.19 25);
      color: white;
      font-size: 14px;
      font-weight: 500;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .retry:hover { opacity: 0.9; }
    .cache-info {
      margin-top: 32px;
      padding: 16px;
      border-radius: 12px;
      background: oklch(0.18 0.018 275);
      border: 1px solid oklch(1 0 0 / 0.08);
    }
    .cache-info h2 {
      font-size: 12px;
      font-weight: 500;
      color: oklch(0.68 0.02 280);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }
    .cache-list {
      list-style: none;
      text-align: left;
    }
    .cache-list li {
      font-size: 13px;
      padding: 4px 0;
      display: flex;
      justify-content: space-between;
    }
    .cache-list .label { color: oklch(0.68 0.02 280); }
    .cache-list .value { font-weight: 500; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.56 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>Check your internet connection and try again. Some content may be available from your cache.</p>
    <button class="retry" onclick="window.location.reload()">Try again</button>
    <div class="cache-info">
      <h2>Cached content</h2>
      <ul class="cache-list" id="cache-stats">
        <li><span class="label">Checking...</span></li>
      </ul>
    </div>
  </div>
  <script>
    async function showCacheStats() {
      const el = document.getElementById('cache-stats');
      if (!navigator.serviceWorker?.controller) {
        el.innerHTML = '<li><span class="label">Service worker not active</span></li>';
        return;
      }
      try {
        const cacheNames = await caches.keys();
        if (cacheNames.length === 0) {
          el.innerHTML = '<li><span class="label">No caches available</span></li>';
          return;
        }
        let total = 0;
        const items = [];
        for (const name of cacheNames) {
          const cache = await caches.open(name);
          const keys = await cache.keys();
          total += keys.length;
          items.push(`<li><span class="label">${name}</span><span class="value">${keys.length}</span></li>`);
        }
        items.unshift(`<li><span class="label">Total cached</span><span class="value">${total}</span></li>`);
        el.innerHTML = items.join('');
      } catch {
        el.innerHTML = '<li><span class="label">Unable to read caches</span></li>';
      }
    }
    showCacheStats();
  </script>
</body>
</html>
